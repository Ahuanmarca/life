<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Conway's Game of Life</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #2e2e2e;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
<canvas id="life"></canvas>
<script>
const canvas = document.getElementById("life");
const ctx = canvas.getContext("2d");
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

let scale = 10;
let zoom = 1;
let offsetX = 0;
let offsetY = 0;
let ghostFade = 0.05;

let cols = Math.floor(width / scale);
let rows = Math.floor(height / scale);

let grid = createGrid(cols, rows);
let ghosts = Array.from({ length: rows }, () => Array(cols).fill(0));

function createGrid(cols, rows) {
  return Array.from({ length: rows }, () =>
    Array.from({ length: cols }, () => Math.random() < 0.1 ? 1 : 0));
}

function draw() {
  ctx.fillStyle = "rgba(46,46,46,0.25)";
  ctx.fillRect(0, 0, width, height);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      if (grid[y][x]) {
        ghosts[y][x] = 1.0;
        ctx.fillStyle = "#ffb347"; // pastel orange
      } else if (ghosts[y][x] > 0) {
        ghosts[y][x] -= ghostFade;
        ctx.fillStyle = `rgba(255, 179, 71, ${ghosts[y][x]})`;
      } else {
        continue;
      }
      ctx.fillRect((x * scale - offsetX) * zoom, (y * scale - offsetY) * zoom, scale * zoom, scale * zoom);
    }
  }
}

function update() {
  const next = createGrid(cols, rows).map((row, y) =>
    row.map((_, x) => {
      const neighbors = countNeighbors(grid, x, y);
      return (grid[y][x] === 1 && (neighbors === 2 || neighbors === 3)) ||
             (grid[y][x] === 0 && neighbors === 3) ? 1 : 0;
    })
  );
  grid = next;
}

function countNeighbors(grid, x, y) {
  let sum = 0;
  for (let j = -1; j <= 1; j++) {
    for (let i = -1; i <= 1; i++) {
      if (i === 0 && j === 0) continue;
      const col = (x + i + cols) % cols;
      const row = (y + j + rows) % rows;
      sum += grid[row][col];
    }
  }
  return sum;
}

function loop() {
  draw();
  update();
  requestAnimationFrame(loop);
}
loop();

// Zoom pinch
let lastDist = null;
canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (lastDist !== null) {
      let delta = dist - lastDist;
      zoom += delta * 0.005;
      zoom = Math.min(Math.max(zoom, 0.5), 3);
    }
    lastDist = dist;
  }
}, { passive: false });

canvas.addEventListener('touchend', () => {
  lastDist = null;
});

window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
  cols = Math.floor(width / scale);
  rows = Math.floor(height / scale);
  grid = createGrid(cols, rows);
  ghosts = Array.from({ length: rows }, () => Array(cols).fill(0));
});
</script>
</body>
</html>
